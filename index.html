<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line By Line</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gridCanvas" aria-hidden="true"></canvas>

  <div class="menu" id="menu">
    <h1 class="menu-title" id="menuTitle">Line By Line</h1>
    <button class="menu-button" id="beginButton" type="button">Begin</button>
  </div>

  <div class="intro" id="intro" hidden>
    <div class="intro-copy" id="introCopy">
      <div class="intro-line" id="introLinePrimary">In this drawing experience, you begin with a single line and use only that line to construct an artwork.</div>
      <div class="intro-line" id="introLine"></div>
    </div>
    <span class="intro-continue-text">Click anywhere to continue</span>
  </div>

  <div class="draw-stage draw-stage-line" id="drawStageLine" hidden>
    <div class="draw-prompt" id="drawPrompt">Start by drawing a line</div>
    <div class="draw-surface-shell" id="drawSurfaceShellLine">
      <div class="draw-surface" id="drawSurfaceLine"></div>
    </div>
    <button class="clear-line-button" id="clearLineButton" type="button" aria-label="Clear line">
      <img src="Assets/Red_Cross.png" alt="" aria-hidden="true" />
    </button>
  </div>

  <div class="draw-stage draw-stage-free-draw" id="drawStageFreeDraw" hidden>
    <div class="free-draw-stage-layout">
      <div class="free-draw-workspace">
        <!-- assets tray removed; create new lines by dragging from the Draw button -->

        <div class="free-draw-content-stack">
          <div class="draw-stage-title">Draw Freely</div>
          <div class="draw-surface-shell" id="drawSurfaceShellFreeDraw">
            <div class="draw-surface" id="drawSurfaceFreeDraw"></div>
          </div>

          <div class="free-draw-controls-row">
            <div class="color-board" id="colorBoard" aria-label="Color board">
              <div class="color-board-swatch" id="colorSwatch" aria-hidden="true"></div>
              <div class="color-board-palette" id="colorPalette"></div>
            </div>

            <div class="free-draw-function-bar" aria-label="Free Draw functions">
              <button class="function-button" id="drawButton" type="button" aria-label="Draw">
                <img class="draw-button-icon" style="width: 46px; height: 46px;" src="Assets/Pencil_Cursor.png" alt="" aria-hidden="true" />
              </button>
              <button class="function-button active" id="translateButton" type="button" aria-label="Translate Free Draw">
                <img src="Assets/TranslateIcon.png" alt="" aria-hidden="true" />
              </button>
              <button class="function-button" id="eraserButton" type="button" aria-label="Eraser">
                <img style="width: 64px; height: 64px;" src="Assets/Eraser.png" alt="" aria-hidden="true" />
              </button>
              <button class="function-button" id="scaleButton" type="button" aria-label="Scale Free Draw">
                <img src="Assets/ShortLongIcon.png" alt="" aria-hidden="true" />
              </button>
              <button class="function-button" id="curveButton" type="button" aria-label="Curve">
                <img src="Assets/CircularRemapIcon.png" alt="" aria-hidden="true" style="width:46px; height:46px;" />
              </button>
              <button class="function-button" id="bezierCurveButton" type="button" aria-label="Bezier Curve">
                <img src="Assets/BezierCurveIcon.png" alt="" aria-hidden="true" style="width:46px; height:46px;" />
              </button>
              <button class="function-button" id="undoButton" type="button" aria-label="Undo">
                <img src="Assets/UndoIcon.png" alt="" aria-hidden="true" style="width:38px; height:38px;" />
              </button>
              <button class="function-button" id="redoButton" type="button" aria-label="Redo">
                <img src="Assets/RedoIcon.png" alt="" aria-hidden="true" style="width:38px; height:38px;" />
              </button>
              <button class="function-button" id="clearFreeDrawButton" type="button" aria-label="Clear Free Draw">
                <img src="Assets/Red_Cross.png" alt="" aria-hidden="true" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="menu-button next-button" id="nextButton" type="button" hidden>Next</button>
  <button class="menu-button next-button reiterate-button" id="reiterateButton" type="button" hidden>Reiterate Line</button>
  <div class="mode-error" id="modeError" role="status" aria-live="polite" aria-hidden="true" hidden></div>
  <div class="button-tooltip" id="buttonTooltip" role="tooltip" aria-hidden="true"></div>

  <!-- Reiterate overlay: slide-up canvas for redrawing the original line -->
  <div class="reiterate-overlay" id="reiterateOverlay" hidden>
    <div class="reiterate-shell" id="reiterateShell">
      <div class="reiterate-topbar" id="reiterateTopbar">
        <div class="reiterate-topbar-spacer"></div>
        <button class="reiterate-close-button" id="reiterateCloseButton" type="button" aria-label="Close reiterate canvas">×</button>
      </div>
      <canvas id="reiterateCanvas" class="reiterate-canvas" aria-label="Reiterate canvas"></canvas>
      <div class="reiterate-controls">
        <button class="menu-button" id="reiterateClearButton" type="button">Clear</button>
        <button class="menu-button" id="reiterateApplyButton" type="button">Apply</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
